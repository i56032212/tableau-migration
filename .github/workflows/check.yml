name: check

on:
  push:
  pull_request:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: 安裝相依套件
        run: uv sync --locked
      - name: 建置檢視器
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: 檢查提交的 web/dist 與原始碼一致
        if: runner.os == 'Linux'
        run: git diff --exit-code -- web/dist || (echo "web/dist 過期：在 web/ 執行 pnpm build 後提交" && exit 1)
      - name: 安裝 Chromium（端到端測試）
        run: uv run playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      - name: 一鍵檢查
        run: |
          set -o pipefail
          uv run python scripts/check.py 2>&1 | tee check.log
      - name: 測試摘要
        if: always()
        run: |
          if [ -f check.log ]; then
            line=$(grep -E "[0-9]+ (passed|failed|error)" check.log | tail -n 1)
            echo "::notice title=pytest 摘要（${{ runner.os }}）::${line}"
          fi
      - name: 失敗時把檢查紀錄的結尾寫成註記
        if: failure()
        run: |
          if [ -f check.log ]; then
            msg=$(tail -n 120 check.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=一鍵檢查紀錄（最後 120 行）::${msg}"
          fi

  # 第三階段 N2：轉譯後的 SQL 在 PostgreSQL 與 Spark（Databricks 的引擎）實跑；環境不齊全時直接失敗
  engines:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: 安裝相依套件（含 pyspark）
        run: uv sync --locked --group spark
      - name: 方言轉譯與來源資料庫實跑
        env:
          TMIG_REQUIRE_ENGINES: "1"
        run: uv run pytest -q kernel/tests/sqlgen/test_dialect.py kernel/tests/sqlgen/test_engines.py
