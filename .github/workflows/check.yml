name: check

on:
  push:
  pull_request:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  # 暫時的診斷分支：只跑 BigQuery 模擬器的實跑，觀察記憶體與失敗原因
  engines:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: 安裝相依套件
        run: uv sync --locked --group spark --group services
      - name: 啟動 BigQuery 模擬器（記憶體上限 1 GB）
        run: >-
          docker run -d --name bigquery --memory 1g -p 9050:9050
          ghcr.io/goccy/bigquery-emulator:latest --project=tmig --dataset=tmig
      - name: 記錄記憶體（背景）
        run: |
          cat > "$RUNNER_TEMP/memory.sh" <<'SH'
          while true; do
            echo "== $(date +%T)"
            free -m | grep Mem
            docker stats --no-stream --format '{{.Name}} {{.MemUsage}} {{.CPUPerc}}'
            ps -eo rss=,args= --sort=-rss | head -4 | cut -c1-120
            sleep 15
          done
          SH
          nohup bash "$RUNNER_TEMP/memory.sh" > "$RUNNER_TEMP/memory.log" 2>&1 &
      - name: BigQuery 模擬器實跑（失敗立即列出）
        env:
          TMIG_REQUIRE_SERVICES: "1"
          TMIG_TEST_BIGQUERY: 127.0.0.1:9050
          PYTHONPATH: ${{ runner.temp }}
        run: |
          cat > "$RUNNER_TEMP/instafail.py" <<'PY'
          import sys, time
          START = {}
          def pytest_runtest_logstart(nodeid, location):
              START[nodeid] = time.monotonic()
              sys.stdout.write(f"\n>>> {time.strftime('%T')} START {nodeid}\n"); sys.stdout.flush()
          def pytest_runtest_logreport(report):
              if report.when == "call" or report.failed:
                  took = time.monotonic() - START.get(report.nodeid, time.monotonic())
                  sys.stdout.write(f"\n<<< {time.strftime('%T')} {report.outcome} {report.nodeid} ({report.when}, {took:.0f}s)\n")
                  if report.failed:
                      sys.stdout.write(report.longreprtext[-30000:] + "\n")
                  sys.stdout.flush()
          PY
          timeout 1200 uv run pytest -q -p instafail -p no:cacheprovider kernel/tests/sqlgen/test_engines.py kernel/tests/data/test_sources.py -k "bigquery" --durations=10
      - name: 記憶體紀錄與模擬器紀錄
        if: always()
        run: |
          cat "$RUNNER_TEMP/memory.log" | tail -n 400
          docker logs bigquery 2>&1 | tail -n 150
