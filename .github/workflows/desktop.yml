name: desktop

# 桌面版（D0）的 Windows 安裝檔：PyInstaller 打包本機引擎 → 在 Windows 上實跑冒煙測試 →
# Tauri 建置外殼並產生 NSIS 安裝檔，上傳為 CI 產物。
on:
  push:
    paths:
      - "desktop/**"
      - "kernel/src/**"
      - "service/src/**"
      - "web/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  # 打包用 setup-python 的官方 Python（PyInstaller 對官方版本的支援最完整）
  UV_PYTHON_PREFERENCE: only-system

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: 安裝相依套件
        run: uv sync --locked --no-dev --python 3.12
      - name: 建置檢視器
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: 打包本機引擎（PyInstaller）
        run: >
          uv run --no-dev --with pyinstaller pyinstaller desktop/engine/tmig-engine.spec
          --distpath desktop/engine/dist --workpath desktop/engine/build --noconfirm
      - name: 本機引擎冒煙測試（開啟 .twbx、查詢、存成報表套件、關閉後重新開啟）
        run: python desktop/engine/smoke.py desktop/engine/dist/tmig-engine/tmig-engine.exe fixtures/superstore_demo/superstore_demo.twbx
      - name: 建置桌面版安裝檔（Tauri＋NSIS）
        working-directory: desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build
      - name: 上傳安裝檔
        uses: actions/upload-artifact@v5
        with:
          name: TmigDesktop-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
