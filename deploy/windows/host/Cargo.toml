[package]
name = "tmig-server-host"
version = "0.1.0"
description = "報表平台伺服器的 Windows 服務主程式：依 server.toml 啟動並監看伺服器的程序"
edition = "2021"
publish = false

[[bin]]
name = "tmig-server-host"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
