<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>報表桌面版</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #1f2328;
        --muted: #6b7280;
        --page: #f3f4f6;
        --accent: #4c78a8;
        font-family: system-ui, "Segoe UI", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #e6e8eb;
          --muted: #9aa3ad;
          --page: #1b1d21;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--page);
        color: var(--ink);
      }
      main {
        text-align: center;
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
        margin: 16px 0 8px;
      }
      p {
        color: var(--muted);
        margin: 0;
      }
      .bar {
        width: 160px;
        height: 4px;
        margin: 20px auto 0;
        border-radius: 2px;
        background: color-mix(in srgb, var(--accent) 25%, transparent);
        overflow: hidden;
      }
      .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        background: var(--accent);
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>報表桌面版</h1>
      <p id="status">正在啟動本機引擎…</p>
      <div class="bar" aria-hidden="true"></div>
    </main>
  </body>
</html>
