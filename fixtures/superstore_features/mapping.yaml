# CSV 欄名 → 查詢結果的欄位鍵（tmig mapping suggest 產生）
# 人工確認每一列後，把 confirmed 改成 true 再提交；值為 null 的 CSV 欄位不比對
# numeric：auto＝帶格式的值以顯示精度比對、其餘以相對誤差 1e-6；raw；display
confirmed: true
sheets:
  ws_sales_by_segment:
    columns:
      Segment: f_segment
      Sales: sum(f_sales)
    ignore: []
    numeric: auto
  ws_profit_by_ship_mode:
    columns:
      Ship Mode: f_ship_mode
      Profit: sum(f_profit)
    ignore: []
    numeric: auto
  ws_orders_by_region:
    columns:
      Region: f_region
      Distinct count of Order ID: countd(f_order_id)
    ignore: []
    numeric: auto
  ws_segment_kpis:
    columns:
      Segment: f_segment
      Sales: sum(f_sales)
      Profit: sum(f_profit)
      Distinct count of Order ID: countd(f_order_id)
      利潤率: f_calc_1368249927221915648
    ignore: []
    numeric: auto
  ws_monthly_sales_vs_profit:
    columns:
      Month of Order Date: trunc_month(f_order_date)
      Sales: sum(f_sales)
      Profit: sum(f_profit)
    ignore: []
    numeric: auto
  ws_sales_and_profit_by_year:
    columns:
      Year of Order Date: year(f_order_date)
      Sales: sum(f_sales)
      Profit: sum(f_profit)
    ignore: []
    numeric: auto
  ws_category_mix:
    columns:
      Category: f_category
      Sales: sum(f_sales)
      '% of Total Sales': sum(f_sales)#tc_percent_of_total_sales
    ignore: []
    numeric: auto
  ws_region_picker:
    columns:
      Region: f_region
      Sales: sum(f_sales)
    ignore: []
    numeric: auto
  ws_category_detail:
    columns:
      Category: f_category
      Sales: sum(f_sales)
    ignore: []
    numeric: auto
  ws_segment_detail:
    columns:
      Segment: f_segment
      Sales: sum(f_sales)
    ignore: []
    numeric: auto
  ws_region_category_matrix:
    columns:
      Region: f_region
      Category: f_category
      Sales: sum(f_sales)
    ignore: []
    numeric: auto
