[project]
name = "tmig"
version = "0.1.0"
description = "Tableau 移轉核心函式庫：解析、IR、公式、查詢規劃、驗證"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.7,<3",
    "lxml>=5.2",
    "duckdb>=1.1",
    "sqlglot>=30,<31",
    "pyyaml>=6",
    "tableauhyperapi>=0.0.20",
    "pyarrow>=15",
    # 排程的時區（Q1、Q2）：Windows 沒有系統的時區資料庫
    "tzdata>=2024.1",
    # 檔案型資料源（沒有萃取的 Excel）：.xlsx 與舊版的 .xls
    "openpyxl>=3.1",
    "xlrd>=2.0",
]

[project.optional-dependencies]
# 來源資料庫的連線驅動（Live 連線與萃取層）：依公司實際使用的資料庫安裝，例如 uv sync --extra oracle
postgres = ["psycopg[binary]>=3.2"]
oracle = ["oracledb>=2.0"]
databricks = ["databricks-sql-connector>=3.0"]
sqlserver = ["pymssql>=2.3"]
mysql = ["pymysql>=1.1"]
snowflake = ["snowflake-connector-python>=3.12"]
redshift = ["redshift-connector>=2.1"]
trino = ["trino>=0.333"]
presto = ["presto-python-client>=0.8"]
athena = ["pyathena[arrow]>=3.0"]
bigquery = ["google-cloud-bigquery>=3.25"]

[project.scripts]
tmig = "tmig.cli:entry"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tmig"]
