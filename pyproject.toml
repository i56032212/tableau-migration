[project]
name = "tableau-migration"
version = "0.1.0"
description = "Tableau 移轉平台：起步階段的 monorepo 根目錄"
requires-python = ">=3.12,<3.14"
dependencies = ["tmig", "tmig-service"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright[nodejs]>=1.1.380",
    "pytest>=8",
    "lxml-stubs>=0.5",
    "jsonschema>=4.26.0",
    "playwright==1.63.0",
    "httpx>=0.28.1",
    "truststore>=0.10",
    # Live 連線的端到端測試（本機 PostgreSQL、MySQL；沒有時略過）
    "psycopg[binary]>=3.2",
    "pymysql>=1.1",
]
# Spark（Databricks 的引擎）方言的實跑測試：uv sync --group spark；需要 Java 17 以上，沒有時略過
spark = ["pyspark>=3.5,<5"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["kernel", "service"]

[tool.uv.sources]
tmig = { workspace = true }
tmig-service = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["kernel/schema"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 中文全形標點會被誤判為易混淆字元；行長交給 formatter。
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["tmig", "tmig_service"]

[tool.pyright]
include = ["kernel/src", "kernel/tests", "service/src", "service/tests", "scripts", "tools", "desktop/engine/entry.py", "desktop/engine/smoke.py"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["kernel/tests", "service/tests"]
addopts = "-ra"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
