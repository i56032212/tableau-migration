[project]
name = "tmig-service"
version = "0.1.0"
description = "Tableau 移轉查詢服務（FastAPI）：API 只接受篩選與參數狀態，從不接受 SQL"
requires-python = ">=3.12,<3.14"
dependencies = [
    "tmig",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # 身分驗證（P2）：OIDC 的權杖交換與 ID Token 驗章
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
    # 桌面版連到伺服器：用作業系統的憑證存放區（公司內部 CA 簽發的伺服器憑證）
    "truststore>=0.10",
    # 訂閱（Q3）：以檢視器產生 PNG、PDF，多個 view 的 PDF 合併成一份
    "playwright==1.63.0",
    "pypdf>=5",
]

[tool.uv.sources]
tmig = { workspace = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tmig_service"]
