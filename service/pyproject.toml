[project]
name = "tmig-service"
version = "0.1.0"
description = "Tableau 移轉查詢服務（FastAPI）：API 只接受篩選與參數狀態，從不接受 SQL"
requires-python = ">=3.12,<3.14"
dependencies = [
    "tmig",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.uv.sources]
tmig = { workspace = true }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tmig_service"]
